<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NavigatorHub · 暂时离线</title>
    <style>
      html, body { margin: 0; height: 100%; }
      body {
        display: grid; place-items: center;
        background: #0a0a1a; color: #e5e7eb;
        font: 15px/1.7 system-ui, -apple-system, "Microsoft YaHei", sans-serif;
      }
      main {
        max-width: 340px; padding: 28px; text-align: center;
        border: 1px solid rgba(255,255,255,.12); border-radius: 18px;
        background: rgba(255,255,255,.04);
      }
      h1 { margin: 0 0 8px; font-size: 20px; }
      p { margin: 0 0 18px; color: #9aa4b2; font-size: 13px; }
      button {
        padding: 10px 18px; border: 0; border-radius: 12px; cursor: pointer;
        background: linear-gradient(135deg, #22d3ee, #6366f1); color: #fff; font-size: 14px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>暂时离线</h1>
      <p>网络连接不可用。已缓存的页面仍可访问，恢复网络后点下面重试。</p>
      <button onclick="location.reload()">重试</button>
    </main>
  </body>
</html>
